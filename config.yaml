# Бизнес-настройки. Секреты здесь не хранить, они в .env.

shop:
  # Префикс артикулов. Артикул = префикс + дата + порядковый номер за день.
  sku_prefix: "MKT"
  # Создавать товар скрытым (не виден на витрине, пока не включите вручную в админке).
  create_hidden: true
  # Остаток по умолчанию для нового варианта.
  default_quantity: 1
  # ID коллекций (витринных разделов) InSales, в которые добавлять каждый новый товар.
  # Пусто = не добавлять. Коллекцию по категории Claude подбирает сам из списка ниже.
  always_add_to_collections: []

pricing:
  # Наценка по диапазонам закупочной цены. Первое подходящее правило побеждает.
  # max_purchase = верхняя граница закупочной цены (включительно), отсутствие = "всё остальное".
  rules:
    - max_purchase: 300
      markup: 2.5
    - max_purchase: 1000
      markup: 2.0
    - max_purchase: 3000
      markup: 1.7
    - markup: 1.5
  # Минимальная наценка в рублях сверх закупки (защита от слишком дешёвых позиций).
  min_margin: 100
  # Округление розничной цены вверх до кратного этому числу.
  round_up_to: 10
  # Если > 0: показывать "старую цену" (зачёркнутую) = розница * этот коэффициент.
  old_price_factor: 0

catalog:
  # Категории InSales, из которых Claude выбирает. title должен ТОЧНО совпадать
  # с названием категории в админке (Товары -> Категории). Если список пуст,
  # приложение само загрузит категории из InSales при старте.
  categories: []
  # Коллекции (разделы витрины), из которых Claude выбирает. Аналогично.
  collections: []

description:
  # Инструкция Claude о стиле описания. Меняйте под свой магазин.
  style: |
    Пиши на русском, для розничного покупателя. Тон спокойный, без рекламных
    восклицаний и без слов "лучший", "уникальный". Структура: один абзац
    о том, что это и кому подойдёт (2-3 предложения), затем список
    характеристик (материал, размер, цвет, комплект), только те, что видны
    на фото или указаны в заметке. Ничего не выдумывай: если характеристика
    неизвестна, не упоминай её. Без заголовков уровня h1/h2.
  # HTML, который добавляется в конец каждого описания. {} не используются.
  footer_html: ""
  # Максимальная длина названия товара.
  title_max_chars: 80

image_search:
  # Сколько кандидатов запрашивать у поисковика.
  candidates: 8
  # Сколько из них максимум добавить к карточке (после отбора Claude).
  max_selected: 3
  # Ставить фото из интернета перед вашим фото с рынка.
  web_first: true
